name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Generate gradlew
      working-directory: ./Android_SMS_Forwarder
      run: gradle wrapper

    - name: Build with Gradle
      working-directory: ./Android_SMS_Forwarder
      run: ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: SMS-Forwarder-Release
        path: Android_SMS_Forwarder/app/build/outputs/apk/release/app-release-unsigned.apk
