name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.2'

    - name: Build with Gradle
      working-directory: ./Android_SMS_Forwarder
      run: gradle assembleRelease --stacktrace

    - name: Generate Keystore and Sign APK
      working-directory: ./Android_SMS_Forwarder
      run: |
        keytool -genkey -v -keystore my-release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias my-alias -storepass digonto123 -keypass digonto123 -dname "CN=IVAC, OU=Pro, O=IVACMaster, L=Dhaka, S=Dhaka, C=BD"
        APKSIGNER=$(find $ANDROID_HOME/build-tools/ -name apksigner | sort -r | head -n 1)
        $APKSIGNER sign --ks my-release-key.jks --ks-pass pass:digonto123 --ks-key-alias my-alias --key-pass pass:digonto123 app/build/outputs/apk/release/app-release-unsigned.apk
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SMS-Forwarder-Release
        path: Android_SMS_Forwarder/app/build/outputs/apk/release/app-release-unsigned.apk

    - name: Release APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v4.1.0
        name: "IVAC Mobile Proxy Node v4.1.0"
        files: Android_SMS_Forwarder/app/build/outputs/apk/release/app-release-unsigned.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
