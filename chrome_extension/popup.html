<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Digonto QuickFill</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <!-- Compact Header -->
    <div class="header">
        <div class="header-title">
            <span class="logo">🇮🇳</span>
            <span>IVAC Assistant</span>
        </div>
        <div class="header-actions">
            <label class="switch" title="অন/অফ">
                <input type="checkbox" id="ext-toggle" checked>
                <span class="slider round"></span>
            </label>
        </div>
    </div>

    <div class="container">
        <!-- Compact Phone Inputs Grid -->
        <div class="phone-box ivac-box">
            <div class="box-label">📱 IVAC:</div>
            <input type="text" id="manual-phone-input" placeholder="01XXXXXXXXX">
            <button id="save-phone-btn" class="save-btn green-btn">সেভ</button>
        </div>


        <!-- Rocket Payment Accounts Section -->
        <div class="rocket-section">
            <div class="rocket-header">
                <div class="rocket-title">🚀 Rocket Accounts</div>
                <div class="rocket-controls" style="display:flex; align-items:center;">
                    <label class="switch small-switch" title="পেমেন্ট অটোমেশন অন/অফ">
                        <input type="checkbox" id="payment-enabled-toggle" checked>
                        <span class="slider round"></span>
                    </label>
                </div>
            </div>
            
            <!-- Add Rocket Account -->
            <div class="rocket-add-row">
                <input type="text" id="rocket-number-input" placeholder="12 ডিজিট নম্বর" maxlength="12">
                <input type="password" id="rocket-pin-input" placeholder="PIN" maxlength="5">
                <button id="add-rocket-btn" class="save-btn green-btn">যোগ</button>
            </div>
            
            <!-- Rocket Account List -->
            <div id="rocket-list" class="rocket-list">
                <!-- Accounts will be rendered dynamically -->
            </div>
        </div>

        <!-- Webfile Section -->
        <div class="webfile-section">
            <div class="webfile-header">
                <div class="webfile-title">📄 Webfile Upload</div>
                <div class="webfile-controls">
                    <label class="switch small-switch" title="অটো আপলোড অন/অফ">
                        <input type="checkbox" id="webfile-enabled-toggle" checked>
                        <span class="slider round"></span>
                    </label>
                    <button id="webfile-mode-btn" class="mode-btn" title="Auto/Manual মোড পরিবর্তন">Auto</button>
                </div>
            </div>

            <!-- Add Webfile -->
            <div class="webfile-add-row">
                <input type="file" id="webfile-input" accept="application/pdf" style="display:none;">
                <button id="add-webfile-btn" class="add-file-btn">➕ ফাইল যোগ করুন</button>
            </div>

            <!-- Webfile List -->
            <div id="webfile-list" class="webfile-list">
                <!-- Files will be rendered here dynamically -->
            </div>
        </div>

        <!-- Latest SMS OTP Card -->
        <div class="sms-card">
            <div class="sms-body" id="latest-sms">
                অপেক্ষা করছি...
            </div>
        </div>

        <!-- Payment Link Catcher Card -->
        <div class="sms-card" id="payment-link-card" style="display:none; border:1px solid #93c5fd; background:#eff6ff;">
            <div style="font-size:10px; font-weight:600; color:#1d4ed8; margin-bottom:4px; display:flex; align-items:center; gap:4px;">
                🔗 Payment Link Caught!
            </div>
            <input type="text" id="popup-payment-link" readonly style="width:100%; padding:4px; font-size:10px; border:1px solid #bfdbfe; border-radius:4px; background:#fff; color:#1e293b; margin-bottom:6px;">
            <div style="display:flex; justify-content:space-between; gap:6px;">
                <button id="copy-payment-link-btn" style="flex:1; background:#3b82f6; color:white; border:none; padding:4px; border-radius:4px; cursor:pointer; font-size:10px; font-weight:bold;">📋 Copy</button>
                <button id="delete-payment-link-btn" style="flex:1; background:#fee2e2; color:#ef4444; border:none; padding:4px; border-radius:4px; cursor:pointer; font-size:10px; font-weight:bold;">🗑️ Delete</button>
            </div>
        </div>

        <!-- Footer Server Status -->
        <div class="footer-bar">
            <div class="server-status">
                <span id="server-dot" class="dot red"></span>
                <span id="server-text">বিচ্ছিন্ন</span>
            </div>
            <span style="font-size:9px; color:#64748b;">📌 পেজে ফ্লোটিং কার্ড চালু</span>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
