<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Auto-Fill Dashboard</title>
    <link rel="stylesheet" href="sidepanel.css">
    <script src="pdf.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="header-wrapper" style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 6px; margin-bottom: 8px; border-bottom: 1px solid var(--border-color);">
            <div class="panel-brand" style="display: flex; align-items: center; gap: 5px; min-width: 0;">
                <img src="icon.png" class="panel-brand-logo" alt="IVAC Master Pro" style="width: 20px; height: 20px; object-fit: contain; flex-shrink: 0; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.12));">
                <div style="display: flex; align-items: center; gap: 4px; white-space: nowrap;">
                    <span style="font-size: 11px; font-weight: 800; color: var(--text-main); letter-spacing: -0.2px;">IVAC Master</span>
                    <span style="font-size: 8.5px; font-weight: 800; color: #059669; background: #ecfdf5; border: 1px solid #a7f3d0; padding: 0.5px 3.5px; border-radius: 4px; line-height: 1.1;">REG</span>
                </div>
            </div>
            <div style="display: flex; align-items: center; gap: 4px; flex-shrink: 0;">
                <button type="button" id="btnSwitchToFormFill" title="FormFill Side Panel এ যান" style="font-size: 10px; font-weight: 700; padding: 2.5px 6px; color: #2563eb; border: 1px solid #bfdbfe; border-radius: 6px; background: #eff6ff; cursor: pointer; display: inline-flex; align-items: center; gap: 3px; transition: all 0.15s ease; white-space: nowrap;">
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                    <span>FormFill</span>
                </button>
                <div class="zoom-wrapper" style="display: inline-flex; align-items: center; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 1.5px 3px; gap: 2px;">
                    <button type="button" class="theme-toggle" id="zoomOutBtn" title="Zoom Out" style="width: 17px; height: 17px; padding: 0; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; border: none; background: transparent; cursor: pointer; border-radius: 3px; color: var(--text-main);">−</button>
                    <span id="zoomLevelTxt" style="font-size: 9.5px; font-weight: 700; min-width: 24px; text-align: center; color: var(--text-muted); line-height: 1;">90%</span>
                    <button type="button" class="theme-toggle" id="zoomInBtn" title="Zoom In" style="width: 17px; height: 17px; padding: 0; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; border: none; background: transparent; cursor: pointer; border-radius: 3px; color: var(--text-main);">+</button>
                </div>
            </div>
        </div>

        <div class="input-group">
            <div class="label-wrapper"><label>Web File No:</label><span class="shortcut-badge">Alt+1</span></div>
            <div class="field-container">
                <input type="text" id="webFile" placeholder="e.g. BGDR...">
                <button type="button" class="copy-btn" data-target="webFile">Copy</button>
            </div>
        </div>

        <div class="input-group">
            <div class="label-wrapper"><label>Surname:</label><span class="shortcut-badge">Alt+2</span></div>
            <div class="field-container">
                <input type="text" id="surname">
                <button type="button" class="copy-btn" data-target="surname">Copy</button>
            </div>
        </div>

        <div class="input-group">
            <div class="label-wrapper"><label>Given Name:</label><span class="shortcut-badge">Alt+3</span></div>
            <div class="field-container">
                <input type="text" id="givenName">
                <button type="button" class="copy-btn" data-target="givenName">Copy</button>
            </div>
        </div>

        <div class="input-group">
            <div class="label-wrapper"><label>Passport No:</label><span class="shortcut-badge">Alt+4</span></div>
            <div class="field-container">
                <input type="text" id="passport">
                <button type="button" class="copy-btn" data-target="passport">Copy</button>
            </div>
        </div>

        <div class="input-group">
            <div class="label-wrapper"><label>NID No:</label><span class="shortcut-badge">Alt+5</span></div>
            <div class="field-container">
                <input type="text" id="nid">
                <button type="button" class="copy-btn" data-target="nid">Copy</button>
            </div>
        </div>

        <div class="input-group">
            <div class="label-wrapper"><label>Phone No:</label><span class="shortcut-badge">Alt+6</span></div>
            <div class="field-container">
                <input type="text" id="phone">
                <button type="button" class="copy-btn" data-target="phone">Copy</button>
            </div>
        </div>

        <div class="input-group">
            <div class="label-wrapper"><label>Email:</label><span class="shortcut-badge">Alt+7</span></div>
            <div class="field-container">
                <input type="text" id="email">
                <button type="button" class="copy-btn" data-target="email">Copy</button>
            </div>
        </div>

        <div class="input-group">
            <div class="label-wrapper"><label>DOB:</label><span class="shortcut-badge">Alt+8</span></div>
            <div class="field-container">
                <input type="text" id="dob" placeholder="09-JUN-1982">
                <button type="button" class="copy-btn" data-target="dob">Copy</button>
            </div>
        </div>

        <div class="input-group">
            <div class="label-wrapper"><label>Password:</label><span class="shortcut-badge">Alt+9</span></div>
            <div class="field-container">
                <input type="text" id="password">
                <button type="button" class="copy-btn" data-target="password">Copy</button>
            </div>
        </div>

        <button type="button" class="clear-btn" id="clearBtn">🗑️ Clear All Data</button>

        <div class="upload-section">
            <label for="pdfUpload" class="upload-btn">📂 Upload Webfile (PDF)</label>
            <input type="file" id="pdfUpload" accept="application/pdf" style="display: none;">
            <p id="uploadStatus">
                <span class="loader" id="loader"></span>
                <span id="statusText">আপলোড করলে ফর্ম অটোমেটিক পূরণ হয়ে যাবে</span>
            </p>
        </div>
    </div>

    <div id="toast" class="toast">কপি হয়েছে!</div>

    <script src="sidepanel.js"></script>
</body>
</html>
